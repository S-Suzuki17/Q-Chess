name: Verify public guidance maintenance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-content-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guidance-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify review gate and public-page checks
        run: node --test scripts/release/content-maintenance.test.mjs scripts/qa/check-public-content.test.mjs
      - name: Require guidance review for relevant changes
        env:
          CONTENT_BASE: ${{ github.event.pull_request.base.sha }}
          CONTENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/release/content-maintenance.mjs --base "$CONTENT_BASE" --head "$CONTENT_HEAD"
